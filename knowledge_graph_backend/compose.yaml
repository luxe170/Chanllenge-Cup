services:
  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://career_prism:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/career_prism
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      IMPORT_ROOT: /data
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ../data/processed:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["career-prism-kg", "worker", "--poll-seconds", "2"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://career_prism:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/career_prism
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      IMPORT_ROOT: /data
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ../data/processed:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from app.database import engine; from app.runtime import get_graph_repository; c=engine.connect(); c.execute(text('SELECT 1')); c.close(); assert get_graph_repository().health()['status'] == 'ok'"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  migrate:
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://career_prism:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/career_prism
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_prism
      POSTGRES_USER: career_prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_prism -d career_prism"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
